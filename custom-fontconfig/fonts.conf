<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

<!-- Alias generic font aliases to fonts which I like -->
	<alias>
    		<family>sans-serif</family>
    			<prefer>
        			<family>Syzpori Sans</family>
    			</prefer>
	</alias>
	<alias>
    		<family>serif</family>
    			<prefer>
        			<family>Syzpori Serif</family>
    			</prefer>
	</alias>
	<alias>
    		<family>monospace</family>
    			<prefer>
        			<family>Syzpori Mono</family>
    			</prefer>
	</alias>
	<alias>
    		<family>system-ui</family>
    			<prefer>
        			<family>Syzpori Sans</family>
    			</prefer>
	</alias>
</fontconfig>

